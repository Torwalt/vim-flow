<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111714" />
    <title>vim-flow</title>
    <link rel="stylesheet" href="./src/web/style.css" />
    <script type="module" src="./src/web/main.ts"></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">VIM-FLOW / 001</p>
        <h1>A place for your muscle memory.</h1>
        <p class="intro">A free game for people who miss moving at the speed of thought.</p>
      </header>
      <section class="viewport" aria-label="Game viewport">
        <div class="tabline"><span>field</span><span>40 × 20</span></div>
        <canvas id="world" tabindex="0" aria-label="A seeded text field with a highlighted cursor"></canvas>
        <div class="statusline"><span id="status-mode">NORMAL</span><span id="status-detail">row 1 · col 1</span></div>
      </section>
      <footer><span>Bend × TypeScript</span><span>Click the field, then move with h j k l w b e W B E, counts, f/F, gg and G.</span></footer>
    </main>
  </body>
</html>
